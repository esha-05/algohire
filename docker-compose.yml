x-backend: &backend
  build: ./backend
  restart: unless-stopped
  environment: &env
    DATABASE_URL: postgres://certi:certi@postgres:5432/certi
    REDIS_HOST: redis
    WA_URL: http://whatsapp-mock:4010
    JWT_SECRET: change-me-in-prod
    PUBLIC_URL: http://localhost:8080
    STORAGE_DIR: /data/certs
    ENABLE_TEST_HOOKS: "1"        # demo/test only: lets tests age a batch to trigger the SLA scan. Never set in production.
  volumes: [certs:/data/certs]

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: certi, POSTGRES_PASSWORD: certi, POSTGRES_DB: certi }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U certi"], interval: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }
  whatsapp-mock:
    build: ./whatsapp-mock
    environment: { FAIL_RATE: "0.2", HANG_RATE: "0.15" }
    ports: ["4010:4010"]            # GET http://localhost:4010/sent shows every message "delivered"
  migrate:
    <<: *backend
    restart: "no"
    command: node dist/migrate.js
    depends_on: { postgres: { condition: service_healthy } }
  api:
    <<: *backend
    command: node dist/server.js
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"], interval: 4s, retries: 30 }
  worker:                            # scale with: docker compose up --scale worker=3
    <<: *backend
    command: node dist/worker.js
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: { api: { condition: service_healthy } }
  tests:
    <<: *backend
    restart: "no"
    profiles: [test]
    command: npx vitest run
    environment: { <<: *env, API_URL: "http://api:3000/api" }
    depends_on: { api: { condition: service_healthy }, worker: { condition: service_started } }

volumes: { pgdata: {}, redisdata: {}, certs: {} }
